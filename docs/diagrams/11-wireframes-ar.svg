"8" fill="#6B7280" text-anchor="middle" font-weight="400">towards one and its card appears</text><text x="787.0" y="475" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle" font-weight="400">on its own.</text><ellipse cx="773.0" cy="496" rx="4" ry="4" fill="#1B74E4" stroke="#1B74E4" stroke-width="1.6"/><ellipse cx="787.0" cy="496" rx="4" ry="4" fill="#D7DBE3" stroke="#D7DBE3" stroke-width="1.6"/><ellipse cx="801.0" cy="496" rx="4" ry="4" fill="#D7DBE3" stroke="#D7DBE3" stroke-width="1.6"/><rect x="714" y="508" width="146" height="24" rx="12" fill="#1B74E4" stroke="#1B74E4" stroke-width="1.6"/><text x="787.0" y="524" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Next</text><text x="787.0" y="548" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle" font-weight="400">Skip</text><rect x="958" y="100" width="250" height="480" rx="16" fill="#FFFFFF" stroke="#142C56" stroke-width="1.8"/><rect x="968" y="110" width="230" height="16" rx="4" fill="#EDEFF4" stroke="#EDEFF4" stroke-width="1.6"/><text x="980" y="122" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="7.5" fill="#6B7280" text-anchor="start" font-weight="400">9:41</text><text x="1186" y="122" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="7.5" fill="#6B7280" text-anchor="end" font-weight="400">100%</text><text x="1083.0" y="600" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="11.5" fill="#142C56" text-anchor="middle" font-weight="700">AR - Tour running</text><text x="1083.0" y="616" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="400">Camera, the station's name, and a speaker.</text><text x="1083.0" y="627" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="400">Lit means it is talking.</text><rect x="964" y="106" width="238" height="468" rx="12" fill="#2B3444" stroke="#2B3444" stroke-width="1.6"/><text x="1083.0" y="250" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="8" fill="#C3CBDA" text-anchor="middle" font-weight="400">live camera - 3D station in place</text><rect x="978" y="140" width="28" height="28" rx="14" fill="#142C56" stroke="#142C56" stroke-width="1.6"/><text x="992" y="159" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">&lt;</text><rect x="1096" y="140" width="26" height="26" rx="13" fill="#142C56" stroke="#142C56" stroke-width="1.6"/><text x="1109" y="158" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text><rect x="1128" y="140" width="58" height="26" rx="13" fill="#142C56" stroke="#142C56" stroke-width="1.6"/><text x="1157" y="157" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="7.5" fill="#FFFFFF" text-anchor="middle" font-weight="400">English</text><rect x="978" y="506" width="210" height="44" rx="14" fill="#142C56" stroke="#142C56" stroke-width="1.6"/><text x="1067.0" y="526" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="7.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">From a Chapel to the</text><text x="1067.0" y="535" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="7.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Founding of a Parish</text><ellipse cx="1162" cy="528" rx="14" ry="14" fill="#1B74E4" stroke="#1B74E4" stroke-width="1.6"/><text x="1162" y="532" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="700">spk</text><rect x="1254" y="100" width="250" height="480" rx