<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="702" viewBox="0 0 1550 702"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker></defs><rect width="1550" height="702" fill="#FFFFFF"/><text x="775.0" y="34" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#142C56" text-anchor="middle">SanctiWalk AR - Unity Application Wireframes</text><text x="775.0" y="58" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400">The separate ARCore application SanctiWalk hands over to. Dark screens are the live camera; the operator's setup flow is hidden behind a gesture.</text><rect x="70" y="100" width="250" height="480" rx="16" fill="#FFFFFF" stroke="#142C56" stroke-width="1.8"/><rect x="80" y="110" width="230" height="16" rx="4" fill="#EDEFF4" stroke="#EDEFF4" stroke-width="1.6"/><text x="92" y="122" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="7.5" fill="#6B7280" text-anchor="start" font-weight="400">9:41</text><text x="298" y="122" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="7.5" fill="#6B7280" text-anchor="end" font-weight="400">100%</text><text x="195.0" y="600" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="11.5" fill="#142C56" text-anchor="middle" font-weight="700">AR - Entry</text><text x="195.0" y="616" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="400">Wordmark, viewfinder, instruction. No</text><text x="195.0" y="627" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="400">button: the marker is read continuously.</text><rect x="76" y="106" width="238" height="468" rx="12" fill="#0C