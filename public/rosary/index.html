const beadEls = { loop: [], pend: [] };

/* ==================================================================
   BUILD THE ROSARY
   ================================================================== */
function buildRosary() {
  const frag = document.createDocumentFragment();

  for (let i = 0; i < LOOP_COUNT; i++) {
    const large = LOOP_LARGE.indexOf(i) !== -1;
    const b = document.createElement("div");
    b.className = "bead" + (large ? " large" : "");
    const p = loopPos(i);
    place(b, p.x, p.y, large ? BEAD_LARGE : BEAD_SMALL);
    beadEls.loop.push(b);
    frag.appendChild(b);
  }
  for (let i = 0; i < PENDANT_POS.length; i++) {
    const q = PENDANT_POS[i];
    const b = document.createElement("div");
    b.className = "bead" + (q.size === BEAD_LARGE ? " large" : "");
    place(b, q.x, q.y, q.size);
    beadEls.pend.push(b);
    frag.appendChild(b);
  }
  el.rosary.appendChild(frag);

  const svg = document.getElementById("chain");
  svg.setAttribute("viewBox", "0 0 " + GEO.w + " " + GEO.h);
  svg.setAttribute("width", GEO.w);
  svg.setAttribute("height", GEO.h);
  el.rosary.style.width  = GEO.w + "px";
  el.rosary.style.height = GEO.h + "px";

  place(el.medal, MEDAL_POS.x, MEDAL_POS.y, MEDAL_SIZE);
  place(el.cross, CROSS_POS.x, CROSS_POS.y, CROSS_SIZE);

  // The medal face is a tall oval rather than a circle.
  const face = document.getElementById("medal-face");
  face.style.left   = "1px";
  face.style.top    = "-3px";
  face.style.width  = (MEDAL_SIZE - 2) + "px";
  face.style.height = (MEDAL_SIZE + 6) + "px";

  drawCord();
}

/**
 * The cord: one polyline through every bead centre in prayer order, plus
 * two explicit lines joining each end of the loop to the medal - without
 * them the join between ring and medal reads as a gap.
 */
function drawCord() {
  const pts = [[CROSS_POS.x, CROSS_POS.y]];
  for (let i = 0; i < PENDANT_POS.length; i++) pts.push([PENDANT_POS[i].x, PENDANT_POS[i].y]);
  pts.push([MEDAL_POS.x, MEDAL_POS.y]);
  for (let i = 0; i < LOOP_COUNT; i++) { const p = loopPos(i); pts.push([p.x, p.y]); }
  pts.push([MEDAL_POS.x, MEDAL_POS.y]);

  document.getElementById("cord").setAttribute("points",
    pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" "));

  const first = loopPos(0), last = loopPos(LOOP_COUNT - 1);
  const join = (id, p) => {
    const l = document.getElementById(id);
    l.setAttribute("x1", p.x.toFixed(1)); l.setAttribute("y1", p.y.toFixed(1));
    l.setAttribute("x2", MEDAL_POS.x);    l.setAttribute("y2", MEDAL_POS.y);
  };
  join("cord-a", first);
  join("cord-b", last);
}

// A little headroom so the beads never crowd the edges and the active
// bead's halo stays whole while the stage eases to a new size.
const FIT_MARGIN = 0.94;

function fitRosary() {
  const r = el.stage.getBoundingClientRect();
  if (!r.height) return;
  const s = Math.max(Math.min(r.width / GEO.w, r.height / GEO.h, 1.25) * FIT_MARGIN, 0.3);
  el.rosary.style.setProperty("--rs", s.toFixed(3));
  // Shrink the layout box to the painted size so the stage can centre it.
  el.rosary.style.width  = (GEO.w * s).toFixed(1) + "px";
  el.rosary.style.height = (GEO.h * s).toFixed(1) + "px";
}

/* ==================================================================
   BACKGROUND
   ================================================================== */
let bgFront = true;
let currentSceneSrc = null;
let sceneToken = 0;
const sceneCache = {};      // url -> true if it loaded, false if it is missing

/**
 * Try each candidate in turn and hand back the first that actually loads,
 * so a decade with no picture of its own quietly borrows its set's, and a
 * set with none borrows the design image. Results are remembered, so a
 * missing file is only ever requested once.
 */
function resolveScene(candidates, done) {
  let i = 0;
  (function next() {
    if (i >= candidates.length) return done(null);
    const src = candidates[i++];
    if (!src) return next();
    if (sceneCache[src] === false) return next();
    if (sceneCache[src]) return done(src);          // already measured
    const probe = new Image();
    // Remember the true pixel size: the camera uses it to avoid magnifying
    // a small picture past the point where it turns soft.
    probe.onload  = function () {
      sceneCache[src] = { w: probe.naturalWidth, h: probe.naturalHeight };
      done(src);
    };
    probe.onerror = function () { sceneCache[src] = false; next(); };
    probe.src = src;
  })();
}

/* ==================================================================
   VIRTUAL CAMERA

   One painting, ten framings, moved by the prayer itself. Nothing here
   runs on a timer of its own: the Hail Mary you are on chooses the
   framing, and the camera eases there. Arriving mid-glide simply
   re-aims from wherever it currently is, so the motion never stops
   dead and never snaps.
   ================================================================== */
const Camera = { el: null, path: CAMERA_REST, index: 0, key: "", dims: null };

/* How far a picture may be enlarged beyond its own pixels before it turns
   soft. Paintings sit behind a dark veil here, so they take more of this
   than a photograph would - but a small file still cannot be pushed to
   1.7x without showing it. */
const UPSCALE_TOLERANCE = 2.2;
const MIN_CAMERA_ZOOM   = 1.20;   // always leave room to move

/* Every painting must actually travel. A tall picture in a tall frame has
   almost no width to spare, so without this it could only creep. We push
   in just far enough to open up room to move - never past MAX_CAMERA_ZOOM,
   so it cannot turn to mush. */
const MIN_TRAVEL   = 0.45;        // of the frame's short side
const MAX_CAMERA_ZOOM = 1.95;

/* A long move takes longer and dips slightly darker on the way, so
   crossing the painting feels like a slow reveal rather than a rush. */
const FAR_MOVE     = 0.30;        // how far counts as "far"
let   dimTimer     = null;


/**
 * Centre the painting on a framing, clamped so no empty space shows.
 *
 * The picture is given its OWN aspect ratio, sized just large enough to
 * cover the frame, and then moved. That is what makes a wide painting
 * pannable: if it were squeezed into a frame-shaped box, the sides would
 * be cropped away inside the element and the camera could never travel to
 * them - on a tall phone screen a 2:1 painting would lose most of itself.
 */
function cameraApply(img, pt, immediate) {
  if (!img || !pt) return;
  const box = el.bgLayer.getBoundingClientRect();
  const W = box.width, H = box.height;
  if (!W || !H) return;

  // The painting at its own proportions, scaled to just cover the frame.
  const d = Camera.dims;
  let cover = 1, cw = W, ch = H;
  if (d && d.w && d.h) {
    cover = Math.max(W / d.w, H / d.h);
    cw = d.w * cover;
    ch = d.h * cover;
  }

  const maxZ = (d && d.w) ? Math.max(MIN_CAMERA_ZOOM, UPSCALE_TOLERANCE / cover) : 99;
  let z = Math.max(1, Math.min(pt[2], maxZ));

  // Open up room to travel if this picture has none to spare.
  const needed = Math.min(W, H) * MIN_TRAVEL;
  if (Math.max(cw * z - W, ch * z - H) < needed) {
    const forX = (W + needed) / cw, forY = (H + needed) / ch;
    z = Math.min(MAX_CAMERA_ZOOM, Math.max(z, Math.min(forX, forY)));
  }

  // Put the focus point in the middle of the frame...
  let tx = W / 2 - pt[0] * cw * z;
  let ty = H / 2 - pt[1] * ch * z;
  // ...then pull it back inside, so an edge never lifts off the frame.
  tx = Math.max(W - cw * z, Math.min(0, tx));
  ty = Math.max(H - ch * z, Math.min(0, ty));

  if (immediate) img.style.transition = "none";
  img.style.width  = cw.toFixed(1) + "px";
  img.style.height = ch.toFixed(1) + "px";
  img.style.transform = "translate(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px) scale(" + z.toFixed(3) + ")";
  if (immediate) { void img.offsetWidth; img.style.transition = ""; }
}

function cameraPoint() {
  const p = Camera.path || CAMERA_REST;
  return p[Math.max(0, Math.min(Camera.index, p.length - 1))];
}

/**
 * Aim the camera for this moment in the prayer. The framing index comes
 * from the Hail Mary being said, so the picture and the prayer advance
 * together.
 */
function cameraUpdate(setKey, decade, index) {
  const path = (decade >= 1 && CAMERA_PATHS[setKey] && CAMERA_PATHS[setKey][decade - 1])
             ? CAMERA_PATHS[setKey][decade - 1]
             : CAMERA_REST;

  const from = cameraPoint();
  Camera.path = path;
  Camera.key = setKey + ":" + decade;
  Camera.index = index;
  const to = cameraPoint();

  // How far this move travels across the painting.
  const dist = Math.hypot(to[0] - from[0], to[1] - from[1]) + Math.abs(to[2] - from[2]) * 0.4;

  const img = Camera.el;
  if (img) {
    // Farther means slower - a long journey should not feel hurried.
    const dur = Math.round(Math.max(12000, Math.min(34000, CAMERA_GLIDE_MS * (0.62 + dist * 1.7))));
    img.style.setProperty("--cam-glide", dur + "ms");

    // And a gentle dip in the light while crossing a long distance.
    clearTimeout(dimTimer);
    if (dist > FAR_MOVE) {
      img.style.setProperty("--cam-dim-dur", Math.round(dur * 0.42) + "ms");
      img.style.setProperty("--cam-dim", "0.74");
      dimTimer = setTimeout(function () {
        img.style.setProperty("--cam-dim", "1");
      }, Math.round(dur * 0.5));
    } else {
      img.style.setProperty("--cam-dim", "1");
    }
  }

  cameraApply(img, to, false);
}

/** Crossfade to `src`, the new painting entering already framed. */
function crossfadeTo(src) {
  const incoming = bgFront ? el.bgB : el.bgA;
  const outgoing = bgFront ? el.bgA : el.bgB;
  incoming.src = src;                       // already in cache from the probe
  Camera.dims = sceneCache[src] || null;    // its true size caps the zoom
  Camera.el = incoming;
  cameraApply(incoming, cameraPoint(), true);   // place it before it is seen
  incoming.classList.add("on");
  outgoing.classList.remove("on");
  bgFront = !bgFront;
}

/**
 * Show the scene for a given set and decade. Decade 0 means the opening
 * prayers, which use the set's own picture.
 */
function setScene(setKey, decade) {
  el.app.dataset.set = setKey;              // drives the per-set veil tint
  const list = SCENES[setKey] || [];
  const candidates = [];
  if (decade >= 1 && decade <= list.length) candidates.push(list[decade - 1]);
  candidates.push(SET_IMAGE[setKey], DESIGN_IMAGE);

  // If decades are crossed quickly, only the newest request may paint.
  const token = ++sceneToken;
  resolveScene(candidates, function (src) {
    if (token !== sceneToken) return;
    if (!src || src === currentSceneSrc) return;   // nothing to change
    currentSceneSrc = src;
    crossfadeTo(src);
  });
}

/**
 * Which decade is being prayed right now. Derived from the existing step
 * pointer rather than kept as a second copy of the state: the opening
 * prayers report 0, and the closing prayers keep the fifth decade's scene
 * instead of jumping back.
 */
/**
 * Which of the ten framings belongs to this step. The Hail Marys are the
 * journey: bead 1 opens wide, bead 10 pulls back. The prayers that open
 * and close a decade sit at those same two ends, so the move into a new
 * mystery starts from the wide shot and the decade finishes on it.
 */
function cameraIndexFor(step) {
  if (!step) return 0;
  if (step.kind === "hm" && step.beadTotal === 10) return step.beadNum - 1;
  if (step.kind === "glory" || step.kind === "fatima") return 9;
  return 0;      // the announcement and its Our Father: the establishing shot
}

function currentDecade() {
  for (let i = Math.min(S.idx, S.seq.length - 1); i >= 0; i--) {
    const st = S.seq[i];
    if (st && st.decade) return st.decade;
  }
  return 0;
}

function makeMotes() {
  const layer = $("bg-layer");
  for (let i = 0; i < 16; i++) {
    const m = document.createElement("div");
    m.className = "mote";
    const size = 1 + Math.random() * 2.2;
    m.style.width = m.style.height = size.toFixed(1) + "px";
    m.style.left = (Math.random() * 100).toFixed(1) + "%";
    m.style.top  = (100 + Math.random() * 30).toFixed(1) + "%";
    m.style.boxShadow = "0 0 " + (4 + size * 3).toFixed(0) + "px rgba(255,228,168,.8)";
    m.style.animationDuration = (26 + Math.random() * 34).toFixed(1) + "s";
    m.style.animationDelay = (-Math.random() * 50).toFixed(1) + "s";
    layer.appendChild(m);
  }
}

/* ==================================================================
   RENDER A STEP
   ================================================================== */
function beadElement(bead) {
  if (!bead) return null;
  if (bead.t === "cross") return el.cross;
  if (bead.t === "medal") return el.medal;
  if (bead.t === "loop")  return beadEls.loop[bead.i];
  if (bead.t === "pend")  return beadEls.pend[bead.i];
  return null;
}

/**
 * Light every bead up to the furthest point reached so far - not merely the
 * one in front of the current prayer. The closing prayers sit back on the
 * medal and the cross, and without this the whole rosary would go dark again.
 */
function paintBeads(step) {
  const order = [el.cross].concat(beadEls.pend, [el.medal], beadEls.loop);
  for (let i = 0; i < order.length; i++) order[i].classList.remove("active", "done");

  let far = -1;
  for (let j = 0; j <= S.idx && j < S.seq.length; j++) {
    const e = beadElement(S.seq[j].bead);
    const k = e ? order.indexOf(e) : -1;
    if (k > far) far = k;
  }
  for (let i = 0; i <= far; i++) order[i].classList.add("done");

  const activeEl = beadElement(step.bead);
  if (activeEl) { activeEl.classList.remove("done"); activeEl.classList.add("active"); }
}

function render() {
  const step = S.seq[S.idx];
  const L = P[S.lang];
  if (!step) return finishRosary();

  paintBeads(step);

  // Header
  el.hdrSet.childNodes[0].nodeValue = L.setNames[S.set];
  el.hdrSub.textContent =
    step.decade ? L.ui.decade(step.decade)
    : step.section === "open" ? L.ui.opening
    : L.ui.closingLabel;

  // Mystery strip
  if (step.decade) {
    el.mysteryLine.textContent = L.ui.mysteryOf(step.decade) + " \u00b7 " + L.mysteries[S.set][step.decade - 1][0];
  } else {
    el.mysteryLine.textContent = step.section === "open" ? L.ui.opening : L.ui.closingLabel;
  }

  // The scene follows the decade being prayed, and the camera framing
  // follows the Hail Mary. Both are read off the existing step pointer -
  // the prayer drives the picture, not a timer.
  const dec = currentDecade();
  cameraUpdate(S.set, dec, cameraIndexFor(step));
  setScene(S.set, dec);   // a repeat of the same picture is ignored

  // Prayer, laid out as lines of individually lightable words
  el.prayerName.textContent = step.name;
  Karaoke.on = !!(S.voiceWanted && voiceSupported() && step.voice);
  renderPrayerText(step);
  el.prayerText.scrollTop = 0;

  // Foot
  el.footL.textContent = step.beadNum ? L.ui.bead(step.beadNum, step.beadTotal) : "";
  el.footR.textContent = (S.idx + 1) + " / " + S.seq.length;

  // Size the prayer LAST, once every other line in the panel is in place.
  // Measured any earlier and the foot label is still missing, so the
  // available height is wrong and a prayer can end up slightly too big.
  fitPrayerText();

  // The rosary is deliberately NOT re-fitted here. The stage is a fixed
  // height, so its size is settled once on load and on resize only.
  resetVoiceForStep();
}

/* ==================================================================
   ADVANCE
   ================================================================== */
let advancing = false;
function advance() {
  if (advancing) return;
  advancing = true;
  setTimeout(function () { advancing = false; }, 260);

  if (S.idx >= S.seq.length - 1) return finishRosary();
  S.idx++;
  saveProgress();
  render();
}

function onTap() {
  if (!S.started) return;
  if (el.finish.classList.contains("show")) return;

  S.taps++;
  if (!S.hintDone && S.taps >= 3) {
    S.hintDone = true;
    store.set("rosary.hintDone", "1");
    el.hint.classList.add("gone");
  }
  advance();
}

function finishRosary() {
  const L = P[S.lang];
  stopVoice();
  el.finTitle.textContent = L.ui.finTitle;
  el.finBody.textContent  = L.ui.finBody;
  el.finAgain.textContent = L.ui.again;
  el.finish.classList.add("show");
  store.del("rosary.progress");
}

/* ==================================================================
   MICROPHONE LOUDNESS METER

   Voice -> microphone -> RMS amplitude -> smoothed 0..1 -> the glow.

   Nothing here loops on its own. When the microphone is unavailable the
   value falls to a calm resting glow and simply breathes very gently, so
   the shining bead never disappears.
   ================================================================== */
const Meter = {
  ctx: null, analyser: null, source: null, stream: null, buf: null,
  level: 0,            // smoothed 0..1, what the glow reads
  floorDb: -60,        // adaptive noise floor, learned from the room
  running: false,
  raf: 0,
  supported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
                (window.AudioContext || window.webkitAudioContext))
};

/* Loudness mapping, in dBFS. The bottom of the scale follows the room's
   own noise; the top is anchored to where loud speech actually sits, so a
   whisper stays a whisper instead of saturating the glow. */
const NOISE_GATE_DB = 8;       // must clear the room tone by this much to register
const FULL_SCALE_DB = -14;     // loud speech - the brightest the glow goes
const MIN_SPAN_DB   = 24;      // never let the usable range collapse

const ATTACK  = 0.34;          // rises quickly, so it feels responsive
const RELEASE = 0.055;         // falls slowly, so it settles rather than snaps
const BREATH_PERIOD = 4600;    // ms, the resting breath when it is quiet

async function startMeter() {
  if (!Meter.supported || Meter.running) return false;
  try {
    Meter.stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: false   // AGC would flatten exactly what we measure
      }
    });
  } catch (err) {
    handleMicError(err);
    return false;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  Meter.ctx = new AC();
  // Browsers start the context suspended until a gesture; begin() is one.
  if (Meter.ctx.state === "suspended") { try { await Meter.ctx.resume(); } catch (e) {} }

  Meter.source = Meter.ctx.createMediaStreamSource(Meter.stream);
  Meter.analyser = Meter.ctx.createAnalyser();
  Meter.analyser.fftSize = 1024;
  Meter.analyser.smoothingTimeConstant = 0.25;
  Meter.source.connect(Meter.analyser);   // analyser only - never to the speakers
  Meter.buf = new Float32Array(Meter.analyser.fftSize);

  Meter.running = true;
  syncMicButton();
  return true;
}

function stopMeter() {
  Meter.running = false;
  if (Meter.stream) { Meter.stream.getTracks().forEach(t => t.stop()); Meter.stream = null; }
  if (Meter.source) { try { Meter.source.disconnect(); } catch (e) {} Meter.source = null; }
  if (Meter.ctx)    { try { Meter.ctx.close(); } catch (e) {} Meter.ctx = null; }
  Meter.analyser = null; Meter.buf = null;
  syncMicButton();
}

/** One frame: read the microphone, turn it into a 0..1 loudness. */
function readLoudness() {
  if (!Meter.running || !Meter.analyser) return 0;

  Meter.analyser.getFloatTimeDomainData(Meter.buf);

  let sum = 0;
  for (let i = 0; i < Meter.buf.length; i++) sum += Meter.buf[i] * Meter.buf[i];
  const rms = Math.sqrt(sum / Meter.buf.length);
  const db  = 20 * Math.log10(rms + 1e-7);      // roughly -140 (silent) .. 0 (clipping)

  // Learn the room's own noise: settle down towards quiet moments, creep
  // back up slowly so it can recover if the room gets louder. Clamped to a
  // plausible range so one digitally-silent frame cannot drag it away.
  if (db < Meter.floorDb) Meter.floorDb += (db - Meter.floorDb) * 0.08;
  else                    Meter.floorDb += 0.008;
  Meter.floorDb = Math.min(-40, Math.max(-62, Meter.floorDb));

  // Anything not clearly above the room tone is silence.
  const start = Meter.floorDb + NOISE_GATE_DB;
  const full  = Math.max(FULL_SCALE_DB, start + MIN_SPAN_DB);
  if (db <= start) return 0;

  const norm = Math.min(1, (db - start) / (full - start));
  return Math.pow(norm, 0.75);    // soft knee, so quiet praying still registers
}

/**
 * The render loop. Runs whether or not the microphone is on: without it the
 * value eases to a calm resting glow with a barely-there breath.
 */
function meterFrame(now) {
  Meter.raf = requestAnimationFrame(meterFrame);

  const target = Meter.running ? readLoudness() : 0;

  // Asymmetric smoothing: quick to answer the voice, slow to let go.
  const k = target > Meter.level ? ATTACK : RELEASE;
  Meter.level += (target - Meter.level) * k;

  // A resting breath, only while quiet - it fades out as soon as you speak,
  // so the voice, not a timer, is what drives the glow.
  const breath = 0.055 * (0.5 + 0.5 * Math.sin(now * 2 * Math.PI / BREATH_PERIOD));
  const v = Math.min(1, Meter.level + breath * (1 - Meter.level));

  el.app.style.setProperty("--voice", v.toFixed(4));
}

function handleMicError(err) {
  const L = P[S.lang];
  const name = err && err.name;
  if (name === "NotAllowedError" || name === "SecurityError")      toast(L.ui.micDenied);
  else if (name === "NotFoundError" || name === "OverconstrainedError") toast(L.ui.micNoDevice);
  else if (name === "NotReadableError")                            toast(L.ui.micBusy);
  else                                                             toast(L.ui.micDenied);
  S.voiceWanted = false;
  syncMicButton();
}

/* ==================================================================
   VOICE
   ================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recRunning = false, wantRunning = false;
let heardWords = [], targetWords = [], silenceTimer = null, thresholdMet = false;
let spokenPointer = 0;      // words lit so far in this step; only ever grows

function voiceSupported() { return !!SR; }
function langTag() { return S.lang === "tl" ? "fil-PH" : "en-US"; }

function startVoice() {
  // The loudness meter is what lights the bead, so start it even where
  // speech recognition itself is unavailable.
  startMeter();

  if (!voiceSupported()) {
    // No speech recognition here. If the meter cannot run either, there is
    // nothing the microphone can do for us - say so and fall back to taps.
    if (!Meter.supported) { S.voiceWanted = false; toast(P[S.lang].ui.micUnsupported); }
    syncMicButton();
    return;
  }
  wantRunning = true;
  ensureRec();
  try { if (!recRunning) rec.start(); } catch (e) { /* already starting */ }
  syncMicButton();
}

function stopVoice() {
  wantRunning = false;
  clearTimeout(silenceTimer);
  if (rec && recRunning) { try { rec.stop(); } catch (e) {} }
  S.voiceLive = false;
  stopMeter();
  syncMicButton();
}

function ensureRec() {
  if (rec) { rec.lang = langTag(); return; }
  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = langTag();

  rec.onstart = function () { recRunning = true; S.voiceLive = true; syncMicButton(); };

  rec.onresult = function (ev) {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) heardWords = heardWords.concat(words(t));
      else interim += " " + t;
    }
    evaluate(interim);
  };

  rec.onerror = function (ev) {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      wantRunning = false; S.voiceWanted = false;
      toast(P[S.lang].ui.micDenied);
      syncMicButton();
    }
  };

  rec.onend = function () {
    recRunning = false; S.voiceLive = false;
    syncMicButton();
    if (wantRunning) setTimeout(function () { try { rec.start(); } catch (e) {} }, 260);
  };
}

function evaluate(interim) {
  const step = S.seq[S.idx];
  if (!step || !step.voice || !targetWords.length) return;

  const all = interim ? heardWords.concat(words(interim)) : heardWords;

  // Interim results are rewritten as the recogniser changes its mind, so the
  // raw pointer can jump backwards. Words already lit must never go dark:
  // the pointer only ever moves forward.
  let p = matchPointer(targetWords, all);
  if (p < spokenPointer) p = spokenPointer;
  spokenPointer = p;

  paintKaraoke(p);

  const prog = p / targetWords.length;
  el.voiceFill.style.width = Math.min(100, prog * 100).toFixed(0) + "%";
  if (prog >= VOICE_THRESHOLD) thresholdMet = true;

  // Wait for you to finish speaking: any new speech resets the silence clock.
  clearTimeout(silenceTimer);
  if (thresholdMet) {
    silenceTimer = setTimeout(function () {
      if (S.seq[S.idx] === step) advance();
    }, SILENCE_SECONDS * 1000);
  }
}

function resetVoiceForStep() {
  const step = S.seq[S.idx];
  heardWords = [];
  spokenPointer = 0;
  thresholdMet = false;
  clearTimeout(silenceTimer);
  el.voiceFill.style.width = "0%";

  const on = S.voiceWanted && voiceSupported() && step && step.voice;
  // Match against exactly the words on screen, so the highlight and the
  // progress can never disagree.
  targetWords = on ? Karaoke.tokens.slice() : [];
  el.voiceTrack.classList.toggle("on", !!on);
}

function syncMicButton() {
  el.btnMic.classList.toggle("active", S.voiceWanted && (voiceSupported() || Meter.supported));
  el.btnMic.classList.toggle("listening", Meter.running || S.voiceLive);
}

/* ==================================================================
   MUSIC

   Quiet looping ambient track that plays under the start screen AND
   straight through into prayer - one <audio> element, started once,
   never restarted, so there is no restart or gap crossing from the
   start screen into a decade. Toggled by the "Background Music"
   setting. The whole point is that nobody downloads 20MB of audio
   just to glance at the start screen and leave, or to pray with music
   off, so the file is never pointed at until playMusic() actually runs
   with music wanted:

     - the <audio> element ships with no `src` and preload="none"
     - `.src` is assigned here, in playMusic(), the first time it's
       actually needed - not on boot, not when the settings panel opens
     - playMusic() is called from the first tap/click/key anywhere on
       the start screen (see unlockMusicOnFirstGesture below) - that is
       the earliest real user gesture available, and browsers require
       one before audio may start
     - if that first gesture is somehow missed, begin() below still
       calls playMusic() as a fallback when the Begin button is tapped
     - playMusic() is idempotent: if the track is already playing it
       does nothing, so calling it again from begin() after the start
       screen already started it just leaves playback exactly where it
       was - that's what keeps it gapless across the two screens
   ================================================================== */
function playMusic() {
  if (!AMBIENT_MUSIC_FILE || !S.musicOn || !el.ambientMusic) return;
  if (!el.ambientMusic.src) el.ambientMusic.src = AMBIENT_MUSIC_FILE;
  el.ambientMusic.loop = true;
  el.ambientMusic.volume = AMBIENT_MUSIC_VOLUME;
  if (!el.ambientMusic.paused) return;   // already playing - leave it alone, no restart
  // Autoplay rules require a user gesture; every caller of playMusic() is
  // itself reached from a click/tap/key handler, which qualifies. If the
  // browser still refuses (e.g. some other policy), fail silently - no
  // error, no toast, the rosary continues without music.
  const p = el.ambientMusic.play();
  if (p && typeof p.catch === "function") p.catch(function () {});
}
function pauseMusic() {
  if (!el.ambientMusic) return;
  el.ambientMusic.pause();
}

/* First real user gesture anywhere on the page - a tap on the start
   screen (its background, the gear, a settings button) or a keypress -
   is what browsers require before audio can start, and it happens well
   before "Begin Today's Rosary" is tapped. Music starts there so it is
   already playing under the paintings on the start screen. Runs once;
   harmless (a no-op, via the `!paused` guard above) if begin() gets
   there first via its own direct call. */
function unlockMusicOnFirstGesture() {
  playMusic();
}
document.addEventListener("pointerdown", unlockMusicOnFirstGesture, { capture: true, once: true });
document.addEventListener("keydown", unlockMusicOnFirstGesture, { capture: true, once: true });

/* ==================================================================
   START SCREEN SLIDESHOW

   All 20 mystery paintings, slowly cross-fading behind the start screen.
   Two <img> elements swap the "on" class; only the one about to be
   needed is ever given a new src, so the first picture paints as fast
   as a single image and the other nineteen load a little ahead of when
   they're shown rather than all at once.
   ================================================================== */
const ALL_SLIDES = [].concat(SCENES.joyful, SCENES.sorrowful, SCENES.glorious, SCENES.luminous);

let slideEls = [];
let slideFront = 0;
let slideNextIdx = 0;
let slideTimer = null;

function startSlideshow() {
  if (!ALL_SLIDES.length || !el.startSlides) return;
  const a = document.createElement("img"); a.alt = ""; a.loading = "eager";
  const b = document.createElement("img"); b.alt = ""; b.loading = "lazy";
  el.startSlides.appendChild(a);
  el.startSlides.appendChild(b);
  slideEls = [a, b];
  slideFront = 0;

  a.addEventListener("load", function () { a.classList.add("on"); }, { once: true });
  a.src = ALL_SLIDES[0];                 // eager: this is the one the screen waits on

  if (ALL_SLIDES.length > 1) b.src = ALL_SLIDES[1];   // pre-fetched, not shown yet
  slideNextIdx = 2 % ALL_SLIDES.length;

  if (!prefersReducedMotion()) scheduleNextSlide();
}

function prefersReducedMotion() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function scheduleNextSlide() {
  clearTimeout(slideTimer);
  if (ALL_SLIDES.length < 2) return;
  slideTimer = setTimeout(advanceSlide, SLIDE_HOLD_MS);
}

function advanceSlide() {
  const back = 1 - slideFront;
  const oldFront = slideEls[slideFront];
  slideEls[back].classList.add("on");
  oldFront.classList.remove("on");
  slideFront = back;

  // The element that just faded out is free - load the picture after
  // next into it while the new front image is being held on screen.
  setTimeout(function () {
    oldFront.src = ALL_SLIDES[slideNextIdx];
    slideNextIdx = (slideNextIdx + 1) % ALL_SLIDES.length;
  }, SLIDE_FADE_MS);

  scheduleNextSlide();
}

function pauseSlideshow() { clearTimeout(slideTimer); }
function resumeSlideshow() { if (!prefersReducedMotion()) scheduleNextSlide(); }

/* ==================================================================
   SCREEN WAKE LOCK
   ================================================================== */
function keepAwake() {
  if (!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function (lock) {
    S.wakeLock = lock;
    lock.addEventListener("release", function () { S.wakeLock = null; });
  }).catch(function () {});
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") {
    if (S.started && !S.wakeLock) keepAwake();
    if (Meter.ctx && Meter.ctx.state === "suspended") { try { Meter.ctx.resume(); } catch (e) {} }
  } else if (Meter.ctx && Meter.ctx.state === "running") {
    try { Meter.ctx.suspend(); } catch (e) {}   // don't hold the mic in the background
  }
});

/* ==================================================================
   PROGRESS
   ================================================================== */
function saveProgress() {
  store.set("rosary.progress", JSON.stringify({ set:S.set, lang:S.lang, idx:S.idx, at:Date.now() }));
}

/* ==================================================================
   START SCREEN

   Top to bottom: a gear (opens the settings panel below), the liturgical
   day (season and week only, computed - see the Liturgical module
   above), today's mystery set in large type, and one primary Begin
   button. Language and which mystery set to pray both live in the
   settings panel now, sourced from S.lang/S.mysterySet, which in turn
   are kept in sync with the app shell via ROSARY_SETTINGS_KEY.
   ================================================================== */
function startSetHeadline(lang, key) {
  const name = START_SET_NAMES[lang][key];
  return lang === "tl" ? "Ang " + name : name;
}
function startSetShort(lang, key) {
  const name = START_SET_NAMES[lang][key];
  return lang === "en" ? name.replace(/^The\s+/, "") : name;
}

function paintStartScreen() {
  const chosen = S.mysterySet !== "today";

  el.liturgicalDay.textContent = Liturgical.describe(new Date());
  el.todayMysteryLabel.textContent = chosen ? "You've Chosen" : "Today's Mystery";
  el.todayMysteryName.textContent = startSetHeadline(S.lang, S.set);
  el.begin.textContent = chosen ? "Begin the Rosary" : "Begin Today's Rosary";
  el.startNote.textContent = P[S.lang].ui.note;

  setScene(S.set, 0);        // the set's own picture while choosing
  paintSettingsPanel();
}

/** Mystery-set labels shown in the settings panel, localized to S.lang. */
const MYSTERY_PANEL_LABELS = {
  en: { today: "Today's Mystery", joyful: "Joyful", sorrowful: "Sorrowful", glorious: "Glorious", luminous: "Luminous" },
  tl: { today: "Ngayong Araw", joyful: "Maligayang", sorrowful: "Mahapding", glorious: "Maluwalhati", luminous: "Liwanag" }
};

function paintSettingsPanel() {
  if (!el.rsLangGroup) return;

  const langBtns = el.rsLangGroup.children;
  for (let i = 0; i < langBtns.length; i++)
    langBtns[i].classList.toggle("sel", langBtns[i].dataset.lang === langToPref(S.lang));

  const mysteryBtns = el.rsMysteryGroup.children;
  for (let i = 0; i < mysteryBtns.length; i++) {
    const b = mysteryBtns[i];
    const key = b.dataset.mystery;
    b.textContent = MYSTERY_PANEL_LABELS[S.lang][key] || MYSTERY_PANEL_LABELS.en[key];
    b.classList.toggle("sel", key === S.mysterySet);
  }

  if (AMBIENT_MUSIC_FILE && el.rsMusicGroup) {
    el.rsMusicLabel.textContent = P[S.lang].ui.music;
    el.rsMusicOn.textContent = P[S.lang].ui.musicOn;
    el.rsMusicOff.textContent = P[S.lang].ui.musicOff;
    el.rsMusicOn.classList.toggle("sel", S.musicOn);
    el.rsMusicOff.classList.toggle("sel", !S.musicOn);
  }
}

/**
 * Applies an incoming { language, mysterySet } to engine state S, whether
 * it came from this screen's own settings panel or from a `storage` event
 * fired by another same-origin context (the app shell, or the rosary open
 * in another tab).
 *
 * While a rosary is actively being prayed (S.started), the mystery set in
 * progress is left alone - changing it mid-decade would yank the beads
 * and prayer text out from under whoever is praying. Only the language
 * still applies live there, exactly like the in-session header toggle
 * already did. The mystery-set preference is still recorded in
 * S.mysterySet so it takes effect the next time the rosary is begun.
 *
 * Music is the one setting that always applies live, in both directions,
 * on the start screen or mid-prayer alike: switching it off should
 * silence the track immediately, not "at the end of this decade" -
 * that's the whole point of the switch. Note that when this call
 * originates from a `storage` event (a change made in the app shell,
 * not this document), there is no user gesture in *this* document, so
 * playMusic()'s play() may be refused by the browser - it fails
 * silently via its own .catch(), which is the correct behavior here.
 */
function applyRosarySettingsToState(settings) {
  const newLang = prefToLang(settings.language);
  const langChanged = newLang !== S.lang;
  const musicChanged = settings.music !== (S.musicOn ? "on" : "off");
  S.mysterySet = settings.mysterySet;
  S.lang = newLang;
  S.musicOn = settings.music !== "off";

  if (musicChanged) {
    if (S.musicOn) playMusic(); else pauseMusic();
  }

  if (S.started) {
    if (langChanged) {
      S.seq = buildSequence(S.set, S.lang);   // same length, so your place is kept
      if (rec) { rec.lang = langTag(); if (recRunning) { try { rec.stop(); } catch (err) {} } }
      el.hint.textContent = P[S.lang].ui.hint;
      render();
    }
  } else {
    S.set = settings.mysterySet === "today" ? DAY_SET[new Date().getDay()] : settings.mysterySet;
    paintStartScreen();
  }
}

let toastTimer = null;
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.toast.classList.remove("show"); }, 3400);
}

/* ==================================================================
   EVENTS
   ================================================================== */
function openRosarySettings() {
  paintSettingsPanel();
  el.rsOverlay.classList.add("open");
}
function closeRosarySettings() {
  el.rsOverlay.classList.remove("open");
}

el.startSettingsBtn.addEventListener("click", function (e) {
  e.stopPropagation();
  openRosarySettings();
});

el.rsClose.addEventListener("click", function (e) {
  e.stopPropagation();
  closeRosarySettings();
});

// Dismiss on backdrop click (but not on clicks inside the panel itself).
el.rsOverlay.addEventListener("click", function (e) {
  if (e.target === el.rsOverlay) closeRosarySettings();
});

el.rsLangGroup.addEventListener("click", function (e) {
  const b = e.target.closest("button"); if (!b) return;
  const next = { language: b.dataset.lang, mysterySet: S.mysterySet, music: S.musicOn ? "on" : "off" };
  saveRosarySettings(next);
  applyRosarySettingsToState(next);
  paintSettingsPanel();
});

el.rsMysteryGroup.addEventListener("click", function (e) {
  const b = e.target.closest("button"); if (!b) return;
  const next = { language: langToPref(S.lang), mysterySet: b.dataset.mystery, music: S.musicOn ? "on" : "off" };
  saveRosarySettings(next);
  applyRosarySettingsToState(next);
  paintSettingsPanel();
});

if (el.rsMusicGroup) {
  el.rsMusicGroup.addEventListener("click", function (e) {
    const b = e.target.closest("button"); if (!b) return;
    const next = { language: langToPref(S.lang), mysterySet: S.mysterySet, music: b.dataset.music };
    saveRosarySettings(next);
    applyRosarySettingsToState(next);
    paintSettingsPanel();
  });
}

// Live two-way sync: a change made in the app shell's own settings, or in
// the rosary open in another tab, lands here. `storage` never fires in
// the context that made the change - that side already applied it
// directly at the click handler above.
window.addEventListener("storage", function (e) {
  if (e.key !== ROSARY_SETTINGS_KEY) return;
  const next = parseRosarySettingsEventValue(e.newValue);
  applyRosarySettingsToState(next);
  paintSettingsPanel();
});

el.btnLang.addEventListener("click", function (e) {
  e.stopPropagation();
  S.lang = S.lang === "en" ? "tl" : "en";
  saveRosarySettings({ language: langToPref(S.lang), mysterySet: S.mysterySet, music: S.musicOn ? "on" : "off" });
  el.btnLang.textContent = S.lang === "tl" ? "TL" : "EN";
  el.hint.textContent = P[S.lang].ui.hint;
  if (S.started) {
    S.seq = buildSequence(S.set, S.lang);   // same length, so your place is kept
    if (rec) { rec.lang = langTag(); if (recRunning) { try { rec.stop(); } catch (err) {} } }
    render();
  } else {
    paintStartScreen();
  }
});

el.btnMic.addEventListener("click", function (e) {
  e.stopPropagation();
  if (!voiceSupported()) { toast(P[S.lang].ui.micUnsupported); return; }
  S.voiceWanted = !S.voiceWanted;
  if (S.voiceWanted) { startVoice(); toast(P[S.lang].ui.micOn); }
  else { stopVoice(); toast(P[S.lang].ui.micOff); }
  render();      // the text re-lays out with or without word highlighting
});

// Tap anywhere to continue - the text panel still scrolls freely
el.tapzone.addEventListener("click", onTap);
el.prayerText.addEventListener("click", function (e) { e.stopPropagation(); onTap(); });

document.addEventListener("keydown", function (e) {
  if (!S.started) return;
  if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); onTap(); }
  if (e.key === "ArrowLeft" && S.idx > 0) { S.idx--; render(); }
});

el.begin.addEventListener("click", begin);
/** Put the rosary down: release the microphone, the music and the screen. */
function endSession() {
  stopVoice();
  pauseMusic();
  if (S.wakeLock) { try { S.wakeLock.release(); } catch (e) {} S.wakeLock = null; }
  S.started = false;
  el.finish.classList.remove("show");
  el.start.classList.remove("hidden");
  paintStartScreen();
  resumeSlideshow();
}

el.btnExit.addEventListener("click", function (e) {
  e.stopPropagation();
  endSession();
  toast(P[S.lang].ui.exited);
});

el.finAgain.addEventListener("click", function () { endSession(); });

function onViewportChange() {
  fitRosary();
  fitPrayerText();
  // The framing is measured in pixels, so re-place it without a glide.
  cameraApply(Camera.el, cameraPoint(), true);
}
window.addEventListener("resize", onViewportChange);
window.addEventListener("orientationchange", function () { setTimeout(onViewportChange, 240); });

/* ==================================================================
   BEGIN
   ================================================================== */
function begin() {
  S.seq = buildSequence(S.set, S.lang);
  S.idx = 0;
  S.started = true;

  el.start.classList.add("hidden");
  if (S.hintDone) el.hint.classList.add("gone");
  pauseSlideshow();

  setScene(S.set, 0);          // render() takes over once the decades begin
  playMusic();                 // this click is the gesture browsers require
  if (S.voiceWanted) startVoice();   // and the gesture that unlocks the mic
  keepAwake();

  requestAnimationFrame(function () { fitRosary(); render(); });
}

/* ==================================================================
   BOOT
   ================================================================== */
document.documentElement.style.setProperty("--scene-fade", SCENE_FADE_MS + "ms");
document.documentElement.style.setProperty("--cam-glide", CAMERA_GLIDE_MS + "ms");
document.documentElement.style.setProperty("--slide-fade", SLIDE_FADE_MS + "ms");
Camera.el = el.bgA;
if (!AMBIENT_MUSIC_FILE) {
  const musicSection = $("rs-music-section");
  if (musicSection) musicSection.style.display = "none";
}
buildRosary();
makeMotes();
Meter.raf = requestAnimationFrame(meterFrame);   // resting breath until the mic starts
startSlideshow();
paintStartScreen();
syncMicButton();
fitRosary();
setTimeout(fitRosary, 120);
</script>
</body>
</html>
