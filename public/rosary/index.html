<style>
/* Primary: Montserrat Bold, for every title and heading.
   Secondary: Poppins, for prayer text and everything else. */
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap');

*, *::before, *::after { box-sizing: border-box; }

:root {
  /* Live microphone loudness, 0..1. Written every frame by the audio
     meter; every glow value in the rosary is derived from it. */
  --voice: 0;

  --gold:        #e8c77a;
  --gold-bright: #fff3cf;
  --gold-deep:   #b98b3a;
  --ink:         #0d0806;
  --parch:       #f6ecd8;
}

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--ink);
  color: var(--parch);
  font-family: 'Poppins', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}

body { display: flex; align-items: center; justify-content: center; overflow: hidden; }

/* Primary type: every title and heading. Montserrat is geometric and wide,
   so it wants less letter-spacing than the old serif did. */
.serif {
  font-family: 'Montserrat', system-ui, sans-serif;
  font-weight: 700;
  letter-spacing: .005em;
}
/* Secondary type: the prayers themselves. */
.body-serif { font-family: 'Poppins', system-ui, sans-serif; }

/* ============================ SHELL ============================ */
#app {
  position: relative;
  width: 100%; height: 100%;
  max-width: 460px;
  margin: 0 auto;
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 0 80px rgba(0,0,0,.9);
}

/* ========================= BACKGROUND ========================== */
#bg-layer { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: #0d0806; }

/* The painting is the camera's film plane. It exactly covers the frame and
   is moved only by the virtual camera - position and zoom are written by
   JS, and the long eased transition is what makes the move cinematic
   rather than mechanical. transform-origin sits at the top-left so the
   translate/scale maths stays simple and clamping is exact. */
#bg-img, #bg-img-next {
  position: absolute; left: 0; top: 0;
  width: 100%; height: 100%;
  /* Width and height are written by the camera to the painting's own
     proportions, so it is never squashed and never pre-cropped. */
  object-fit: cover;
  opacity: 0;
  transform-origin: 0 0;
  transform: scale(1.05);
  /* The light dips a little while the camera crosses a long distance. */
  filter: brightness(var(--cam-dim, 1));
  transition: opacity var(--scene-fade, 900ms) ease,
              transform var(--cam-glide, 19000ms) cubic-bezier(.36,0,.24,1),
              filter var(--cam-dim-dur, 2600ms) ease;
  will-change: transform, opacity;
  backface-visibility: hidden;
}
#bg-img.on, #bg-img-next.on { opacity: 1; }

/* Holy light: warm veil, halo from above, deep floor for text legibility.
   The tint shifts with the set of mysteries, so each carries its own
   atmosphere - and the lower half always stays dark enough to read on. */
#bg-veil {
  position: absolute; inset: 0;
  transition: background 1.2s ease;
  background:
    radial-gradient(120% 80% at 50% -12%,
      rgba(var(--halo, 255,222,160), .20) 0%,
      rgba(var(--halo, 255,200,120), .07) 32%, transparent 62%),
    linear-gradient(to bottom,
      rgba(var(--veil, 28,12,10), .52) 0%,
      rgba(var(--veil, 22,10,9),  .40) 34%,
      rgba(14,7,6,.74) 68%,
      rgba(8,4,4,.95) 100%);
}

/* Joyful - warm and peaceful */
#app[data-set="joyful"]    { --halo: 255,214,150; --veil: 44,24,12; }
/* Sorrowful - solemn, cooler and heavier */
#app[data-set="sorrowful"] { --halo: 198,178,168; --veil: 20,14,16; }
/* Glorious - bright and heavenly */
#app[data-set="glorious"]  { --halo: 255,236,190; --veil: 20,20,38; }
/* Luminous - radiant, clear light */
#app[data-set="luminous"]  { --halo: 214,232,255; --veil: 14,22,34; }

/* Faint radiant beams from the top - very slow, almost subliminal */
#bg-rays {
  position: absolute; inset: -30% -30% 0 -30%;
  background: conic-gradient(from 180deg at 50% 0%,
    transparent 0deg, rgba(255,226,168,.055) 12deg, transparent 24deg,
    transparent 40deg, rgba(255,226,168,.04) 52deg, transparent 64deg,
    transparent 116deg, rgba(255,226,168,.045) 128deg, transparent 140deg,
    transparent 156deg, rgba(255,226,168,.035) 168deg, transparent 180deg);
  animation: rays 90s linear infinite;
  mix-blend-mode: screen;
  pointer-events: none;
}
@keyframes rays { to { transform: rotate(360deg); } }

#vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(105% 78% at 50% 44%, transparent 42%, rgba(0,0,0,.62) 100%);
}

/* Drifting motes of light */
.mote {
  position: absolute; border-radius: 50%;
  background: #ffeec2;
  pointer-events: none;
  filter: blur(.4px);
  animation: mote-rise linear infinite;
}
@keyframes mote-rise {
  0%   { transform: translateY(0) translateX(0); opacity: 0; }
  14%  { opacity: .55; }
  76%  { opacity: .38; }
  100% { transform: translateY(-125vh) translateX(22px); opacity: 0; }
}

/* ========================== HEADER ============================= */
header {
  position: relative; z-index: 20;
  padding: max(14px, env(safe-area-inset-top)) 18px 8px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  flex: 0 0 auto;
}

.set-name {
  font-size: 15px; line-height: 1.25;
  color: #fdf3dc;
  text-shadow: 0 2px 10px rgba(0,0,0,.85);
  margin: 0;
}
.set-sub {
  display: block;
  font-family: 'Poppins', sans-serif;
  font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
  color: rgba(232,199,122,.78);
  margin-top: 5px; font-weight: 400;
}

.tools { display: flex; gap: 7px; align-items: center; }

.tool {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid rgba(232,199,122,.26);
  background: rgba(20,10,8,.42);
  color: rgba(246,236,216,.72);
  backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  cursor: pointer;
  transition: .25s ease;
  font-size: 10px; font-weight: 700; letter-spacing: .04em;
}
.tool:active { transform: scale(.9); }
.tool.active {
  color: #2a1606;
  background: linear-gradient(160deg, #ffeab4, #d9a94f);
  border-color: rgba(255,228,160,.85);
  box-shadow: 0 0 16px rgba(232,199,122,.5);
}
.tool.listening { animation: mic-breathe 2.6s ease-in-out infinite; }
@keyframes mic-breathe {
  0%,100% { box-shadow: 0 0 12px rgba(232,199,122,.4); }
  50%     { box-shadow: 0 0 24px rgba(255,236,180,.85); }
}
.tool svg { width: 16px; height: 16px; }

/* ========================== ROSARY ============================= */
#stage {
  position: relative; z-index: 10;
  flex: 1 1 auto;
  min-height: 0;
  display: grid; place-items: center;
  overflow: hidden;
}

#rosary {
  position: relative;
  width: 336px; height: 515px;   /* kept in step with GEO */
  /* Scaled from the top-left, with fitRosary() also shrinking the layout
     box to match. A transform alone leaves the box its full 396px, and
     once that is taller than the stage the browser stops centring it and
     start-aligns instead, pushing the rosary out of view. */
  transform: scale(var(--rs, 1));
  transform-origin: 0 0;
  /* Deliberately not transitioned. The text panel resizes the stage in one
     frame, so an eased scale would leave the rosary briefly too large for
     its stage and `overflow: hidden` would clip it - most visibly on the
     long Apostles' Creed. Resizing in step with the text keeps it whole. */
}

/* Bead material, exactly as drawn in the original design.
   Size and position come from the layout spec, applied inline by place(). */
.bead {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f0f0f0 40%, #d1d1d1 80%, #a3a3a3 100%);
  box-shadow:
    inset -2px -2px 4px rgba(0,0,0,0.15),
    inset 1px 1px 2px rgba(255,255,255,0.8),
    0 2px 3px rgba(0,0,0,0.4);
  border: 1px solid rgba(200,200,200,0.3);
  transition: transform .55s cubic-bezier(.22,1,.36,1), filter .55s ease;
}


/* Prayed beads take the design's gold, the same as its lit beads */
.bead.done {
  background: radial-gradient(circle at 35% 35%, #fef08a 0%, #eab308 50%, #b45309 100%);
  box-shadow:
    inset -2px -2px 4px rgba(120,60,0,0.3),
    inset 1px 1px 2px rgba(255,255,255,0.8),
    0 2px 4px rgba(0,0,0,0.5);
  border: 1px solid rgba(234,179,8,0.5);
}

/* The bead you are on - lit by the microphone.
   Every value below is driven by --voice (0..1), which the audio meter
   writes each animation frame. Smoothing happens in JS, so there is no
   CSS transition here: a transition would lag behind the voice. At
   --voice: 0 the bead still carries a calm, clearly visible glow. */
.bead.active {
  background: radial-gradient(circle at 35% 35%, #fffbe0 0%, #fde047 38%, #eab308 70%, #b45309 100%);
  border: 1px solid rgba(253, 224, 71, calc(0.55 + var(--voice) * 0.45));
  z-index: 6;
  transition: none;
  transform: scale(calc(1.16 + var(--voice) * 0.46));
  box-shadow:
    inset 1px 1px 2px rgba(255,255,255,.95),
    0 0 calc( 6px + var(--voice) * 14px) rgba(255, 238, 180, calc(0.55 + var(--voice) * 0.45)),
    0 0 calc(16px + var(--voice) * 34px) rgba(255, 213, 120, calc(0.26 + var(--voice) * 0.52)),
    0 0 calc(30px + var(--voice) * 68px) rgba(255, 196,  90, calc(0.09 + var(--voice) * 0.33));
}

/* Four-point star flare behind the active bead - turns very slowly */
.bead.active::after {
  content: "";
  position: absolute; left: 50%; top: 50%;
  width: 74px; height: 74px;
  margin: -37px 0 0 -37px;
  pointer-events: none;
  background:
    radial-gradient(closest-side, rgba(255,238,190,.34), transparent 72%),
    linear-gradient(0deg,  transparent 47.2%, rgba(255,240,200,.60) 50%, transparent 52.8%),
    linear-gradient(90deg, transparent 47.2%, rgba(255,240,200,.60) 50%, transparent 52.8%);
  -webkit-mask-image: radial-gradient(closest-side, #000 12%, transparent 78%);
          mask-image: radial-gradient(closest-side, #000 12%, transparent 78%);
  /* The slow turn is decoration and stays constant; the flare's SIZE and
     BRIGHTNESS come from the voice. `scale` is a separate property from
     `transform`, so it composes with the rotation instead of fighting it. */
  opacity: calc(0.30 + var(--voice) * 0.70);
  scale: calc(0.80 + var(--voice) * 0.85);
  animation: star-turn 14s linear infinite;
}
@keyframes star-turn { to { transform: rotate(360deg); } }

/* Crucifix - the design's shape and dark metal, sized by the layout spec */
#cross {
  position: absolute;
  background-color: rgba(30, 30, 40, 0.9);
  box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 4px 8px rgba(0,0,0,0.6);
  clip-path: polygon(40% 0, 60% 0, 60% 30%, 100% 30%, 100% 45%, 60% 45%, 60% 100%, 40% 100%, 40% 45%, 0 45%, 0 30%, 40% 30%);
  /* A resting filter with the SAME three layers as the lit state. Going
     from `none` would interpolate out of nothing and the glow could sit
     invisible; matching layers makes it fade in properly. */
  filter:
    drop-shadow(0 0 0 rgba(255,243,200,0))
    drop-shadow(0 0 0 rgba(255,208,115,0))
    drop-shadow(0 0 0 rgba(255,176, 60,0));
  transition: filter .9s ease, background-color .9s ease;
}

/* The crucifix and the medal, lit. Bright enough to read against a
   painting, and breathing with the voice like the beads do. */
#cross.active, #medal.active {
  filter:
    drop-shadow(0 0 calc( 7px + var(--voice) * 15px) rgba(255, 243, 200, calc(0.95 + var(--voice) * 0.05)))
    drop-shadow(0 0 calc(20px + var(--voice) * 32px) rgba(255, 208, 115, calc(0.70 + var(--voice) * 0.30)))
    drop-shadow(0 0 calc(44px + var(--voice) * 66px) rgba(255, 176,  60, calc(0.34 + var(--voice) * 0.36)));
}
#cross.active {
  background-color: #f4cc46;
  background-image: linear-gradient(150deg, #fff6d0 0%, #f2c53f 46%, #b9820c 100%);
}
#cross.done { background-color: rgba(48, 42, 34, 0.92); }

/* Centrepiece medal - a tall oval, not a circle. The wrapper carries the
   spec's position and size; the face inside is the drawn metal. */
#medal {
  position: absolute;
  filter:
    drop-shadow(0 0 0 rgba(255,243,200,0))
    drop-shadow(0 0 0 rgba(255,208,115,0))
    drop-shadow(0 0 0 rgba(255,176, 60,0));
  transition: filter .9s ease;
}

#medal-face {
  position: absolute;
  border-radius: 50% / 42%;
  background-color: rgba(30, 30, 40, 0.9);
  box-shadow: inset 0 0 6px rgba(0,0,0,0.8), 0 3px 6px rgba(0,0,0,0.6);
  border: 1px solid rgba(100,100,100,0.4);
}
#medal.active #medal-face {
  background-color: #eab308;
  border-color: rgba(234,179,8,0.6);
}
#medal.done #medal-face { background-color: rgba(48, 42, 34, 0.92); }

/* The cord - a light warm stroke. A dark one vanishes against the dark
   prayer background and the rosary reads as disconnected beads. */
/* Fixed to the canvas size, not 100%, so the viewBox maps 1:1 to pixels
   and the parent's scale is the only scaling applied. */
#chain {
  position: absolute; left: 0; top: 0;
  overflow: visible;
  pointer-events: none;
}
#cord {
  fill: none;
  stroke: rgba(226,214,192,0.32);
  stroke-width: 1.6;
  stroke-linejoin: round;
}
#chain line {
  stroke: rgba(226,214,192,0.42);
  stroke-width: 1.8;
  stroke-linecap: round;
}

/* ======================== PRAYER TEXT ========================== */
#reading {
  position: relative; z-index: 15;
  flex: 0 0 auto;
  padding: 4px 22px max(18px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 6px;
  /* A FIXED share of the screen, whatever the prayer. If this panel grew
     and shrank with the text it would resize the rosary on every bead,
     which is distracting to pray with. Long prayers scroll instead. */
  /* Poppins sets taller lines than the old serif, so the panel needs a
     little more room for the Hail Mary - the prayer said 53 times - to
     fit without scrolling. */
  flex: 0 0 40%;
  min-height: 0;
}

#mystery-line {
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
  color: rgba(232,199,122,.85);
  text-shadow: 0 1px 8px rgba(0,0,0,.9);
  min-height: 13px;
}

#prayer-name {
  font-size: 18px; line-height: 1.18;
  color: #fff8e6;
  text-shadow: 0 2px 14px rgba(0,0,0,.95), 0 0 26px rgba(255,210,130,.22);
  margin: 0;
}

#prayer-text {
  flex: 1 1 auto; min-height: 0;     /* takes the leftover room, scrolls inside it */
  font-size: 16px; line-height: 1.48;
  color: rgba(250,242,226,.93);
  text-shadow: 0 1px 12px rgba(0,0,0,.95);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-right: 4px;
  font-weight: 400;      /* Poppins 300 reads too thin over a painting */
  transition: opacity .45s ease;
}
#prayer-text::-webkit-scrollbar { width: 2px; }
#prayer-text::-webkit-scrollbar-thumb { background: rgba(232,199,122,.35); border-radius: 2px; }

/* ---------- Karaoke: two levels of light ----------
   LEVEL 1, the line being prayed: a soft, steady glow so you know where
   you are. LEVEL 2, each word as you actually say it: brighter, warmer,
   and slightly larger, so the spoken words clearly stand above the line. */

.pline {
  padding: 1px 0;
  transition: opacity .55s ease, filter .55s ease;
}

/* Without the microphone the prayer is simply a prayer - no dimming. */
#prayer-text:not(.karaoke) .pline { opacity: 1; }

#prayer-text.karaoke .pline        { opacity: .38; }
#prayer-text.karaoke .pline.done   { opacity: .46; }   /* prayed, still readable */
#prayer-text.karaoke .pline.active {
  opacity: 1;
  filter: drop-shadow(0 0 14px rgba(255, 216, 140, .28));
}

/* Inside the line being prayed, words not yet said sit back a little so the
   spoken ones clearly lead. This is the gap between LEVEL 1 and LEVEL 2. */
#prayer-text.karaoke .pline.active .pword { color: rgba(248, 240, 224, .60); }

.pword {
  display: inline-block;
  transition: color .42s ease, text-shadow .42s ease,
              transform .42s cubic-bezier(.22,1,.36,1);
  will-change: transform;
}

/* A word that has been spoken. Selector kept at the same weight as the
   active-line rule above, and placed after it, so spoken words win. */
#prayer-text.karaoke .pline .pword.spoken {
  color: #fff6d8;
  transform: scale(1.055);
  text-shadow:
    0 0 10px rgba(255, 238, 185, .92),
    0 0 22px rgba(255, 208, 120, .55),
    0 1px 12px rgba(0,0,0,.9);
}

/* One gentle bloom at the moment it is recognised - never a loop. */
@keyframes word-bloom {
  0%   { transform: scale(1.055); }
  38%  { transform: scale(1.16); }
  100% { transform: scale(1.055); }
}
#prayer-text.karaoke .pline .pword.bloom { animation: word-bloom .62s cubic-bezier(.22,1,.36,1); }

@media (prefers-reduced-motion: reduce) {
  #prayer-text.karaoke .pline .pword.bloom { animation: none; }
}

/* Voice progress - a thin filament of light */
#voice-track {
  height: 1.5px;
  background: rgba(255,255,255,.10);
  border-radius: 2px;
  overflow: hidden;
  opacity: 0; transition: opacity .4s ease;
}
#voice-track.on { opacity: 1; }
#voice-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, rgba(232,199,122,.5), #fff0c8);
  box-shadow: 0 0 9px rgba(255,225,160,.85);
  transition: width .3s ease;
}

#footline {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(246,236,216,.5);
}

/* The tap guide - fades away for good once learned */
#tap-hint {
  text-align: center;
  font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase;
  color: rgba(255,236,190,.68);
  text-shadow: 0 0 14px rgba(255,205,120,.5);
  animation: hint-pulse 2.9s ease-in-out infinite;
  transition: opacity .9s ease, height .9s ease, margin .9s ease;
  height: 13px;
}
@keyframes hint-pulse { 0%,100% { opacity: .42; } 50% { opacity: .95; } }
#tap-hint.gone { opacity: 0 !important; height: 0; margin: 0; pointer-events: none; animation: none; }

/* Whole-screen tap target, sits under the controls */
#tapzone { position: absolute; inset: 0; z-index: 12; cursor: pointer; }

/* ========================= START SCREEN ======================== */
:root {
  --navy:       #151B53;
  --navy-card:  #1E2566;
  --teal:       #1886A0;
  --teal-text:  #5FC7DE;
}

#start {
  position: absolute; inset: 0; z-index: 60;
  display: flex; flex-direction: column; justify-content: center;
  padding: 30px 22px max(30px, env(safe-area-inset-bottom));
  transition: opacity .8s ease, visibility .8s;
  overflow-y: auto;
  background: var(--navy);   /* shows instantly, before the first slide paints */
}
#start.hidden { opacity: 0; visibility: hidden; }

/* Slow cross-fading slideshow of all 20 mystery paintings */
#start-slides { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
#start-slides img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0;
  transition: opacity var(--slide-fade, 1800ms) ease;
}
#start-slides img.on { opacity: 1; }

/* Dark navy veil: atmospheric only, not a contrast guarantor - the card
   below is the more transparent it now is, so it leans on solid-white
   text at measured opacities rather than on this scrim. Eased back from
   its first pass so more of the painting reads through outside the
   card too. */
#start-overlay {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(21,27,83,.25), transparent 55%),
    linear-gradient(to bottom, rgba(21,27,83,.38), rgba(13,17,50,.55));
}

/* Gear button, top corner, replacing the old language toggle there.
   44x44 touch target per the accessibility floor, always readable
   regardless of the image behind it. */
#start-settings-btn {
  position: absolute; z-index: 3;
  top: max(16px, env(safe-area-inset-top)); right: 16px;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 999px;
  background: rgba(21,27,83,.90);
  border: 1px solid rgba(95,199,222,.35);
  color: var(--teal-text);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  cursor: pointer;
  transition: background .25s ease, color .25s ease, transform .3s ease;
}
#start-settings-btn:active { transform: scale(.92); }
#start-settings-btn svg { width: 20px; height: 20px; }

/* Everything else sits on this card. It was measured, not eyeballed: at
   alpha .70 with an 18px blur behind it, the brightest of the 20
   paintings (The Proclamation of the Kingdom - a broad near-white sky
   that blur barely dents, since blur only smooths edges, not a wide
   flat highlight) still leaves solid white text at .90 opacity around
   4.8:1, comfortably over the 4.5:1 floor. Going more transparent than
   this is possible for white text alone (down to ~.64) but not for the
   card's teal text at any size below "large" - see the note on
   liturgical-day/.rs-grid button below. */
#start-card {
  position: relative; z-index: 2;
  margin-top: 44px;
  padding: 26px 22px 22px;
  border-radius: 20px;
  background: rgba(30,37,102,.70);
  border: 1px solid rgba(95,199,222,.20);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: flex; flex-direction: column; gap: 18px;
  text-align: center;
}

/* Teal text (--teal-text) only ever clears AA on this card at ~.86+
   background opacity, which would defeat the point of making the card
   translucent - so every card text color here is white at a measured
   opacity instead. Teal is still the fill color for buttons/selected
   pills, which sit on their own solid backgrounds and aren't affected. */
#liturgical-day {
  font-family: 'Poppins', sans-serif; font-weight: 500;
  font-size: 15px; line-height: 1.5;
  color: rgba(255,255,255,.90);
  margin: 0;
}

#today-mystery-label {
  font-size: 14px; letter-spacing: .18em; text-transform: uppercase;
  color: rgba(255,255,255,.90);
  font-weight: 600;
  margin: 0 0 6px;
}
#today-mystery-name {
  font-size: 28px; line-height: 1.18; margin: 0;
  color: #ffffff;
  text-shadow: 0 2px 16px rgba(0,0,0,.45);
}

#begin {
  padding: 17px;
  border: none; border-radius: 14px;
  background: var(--teal);
  color: #ffffff;
  font-family: 'Montserrat', sans-serif; font-weight: 800;
  font-size: 19px; letter-spacing: .1em; text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(24,134,160,.4);
  transition: transform .3s ease;
}
#begin:active { transform: scale(.975); }

#start-card .note {
  font-size: 14px; line-height: 1.55;
  color: rgba(255,255,255,.90);
  margin: 4px 0 0;
}

/* ==================== ROSARY SETTINGS PANEL ===================== *
 * A dismissible overlay on the start screen itself (not a new page),
 * opened by the gear. Same navy/teal palette and measured contrast as
 * the rest of the start screen; motion is 300-400ms ease, no bounce.
 * ================================================================== */
#rosary-settings-overlay {
  position: absolute; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background: rgba(10,13,42,.62);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  opacity: 0; visibility: hidden;
  transition: opacity .35s ease, visibility .35s;
}
#rosary-settings-overlay.open { opacity: 1; visibility: visible; }

#rosary-settings-panel {
  width: 100%; max-width: 360px;
  max-height: calc(100% - 12px);
  overflow-y: auto;
  border-radius: 20px;
  padding: 20px 20px 22px;
  background: var(--navy-card);
  border: 1px solid rgba(95,199,222,.28);
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
  transform: translateY(10px) scale(.98);
  transition: transform .35s ease;
}
#rosary-settings-overlay.open #rosary-settings-panel { transform: translateY(0) scale(1); }

#rs-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
#rs-title {
  font-family: 'Montserrat', sans-serif; font-weight: 800;
  font-size: 17px; letter-spacing: .02em;
  color: #ffffff; margin: 0;
}
#rs-close {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  margin: -10px -10px -10px 0;
  border: none; border-radius: 999px;
  background: transparent;
  color: rgba(255,255,255,.85);
  cursor: pointer;
  transition: background .25s ease;
}
#rs-close:hover, #rs-close:active { background: rgba(255,255,255,.12); }
#rs-close svg { width: 18px; height: 18px; }

.rs-section + .rs-section { margin-top: 18px; }

.rs-label {
  font-family: 'Poppins', sans-serif; font-weight: 600;
  font-size: 14px; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(255,255,255,.75);
  margin: 0 0 8px;
}

.rs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rs-grid-2 { grid-template-columns: 1fr 1fr; }
.rs-wide { grid-column: 1 / -1; }

.rs-grid button {
  padding: 12px 8px;
  border: 1px solid rgba(95,199,222,.28);
  border-radius: 12px;
  background: transparent;
  color: rgba(255,255,255,.90);
  font-family: 'Montserrat', sans-serif; font-weight: 700;
  font-size: 16px; letter-spacing: .02em;
  cursor: pointer; text-align: center;
  min-height: 44px;
  transition: background .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.rs-grid button.sel {
  /* Deeper than --teal: at this size the text needs the full 4.5:1 AA
     ratio, not just the 3:1 "large text" allowance --teal clears on the
     bigger, bolder Begin button. Same measured value used elsewhere on
     this screen for selected pills. */
  color: #ffffff;
  background: #106a7d;
  border-color: rgba(95,199,222,.8);
  box-shadow: 0 0 20px rgba(24,134,160,.4);
}

/* ========================== FINISH ============================= */
#finish {
  position: absolute; inset: 0; z-index: 55;
  background: radial-gradient(110% 62% at 50% 32%, rgba(255,224,164,.15), rgba(6,3,3,.95) 66%);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 34px; text-align: center;
}
#finish.show { display: flex; animation: fade-in 1.4s ease; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
#finish h2 { font-size: 25px; margin: 0; color: #fff5e0; }
#finish p { font-size: 15.5px; color: rgba(246,236,216,.66); margin: 0; line-height: 1.6; font-weight: 300; }

.ghost-btn {
  margin-top: 8px; padding: 12px 30px;
  border: 1px solid rgba(232,199,122,.42); border-radius: 11px;
  background: transparent; color: rgba(255,236,190,.88);
  font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 12px;
  letter-spacing: .18em; text-transform: uppercase; cursor: pointer;
}

/* ============================ MISC ============================= */
#toast {
  position: absolute; z-index: 70;
  left: 50%; bottom: 96px; transform: translateX(-50%);
  padding: 9px 17px; border-radius: 20px;
  background: rgba(18,9,7,.92);
  border: 1px solid rgba(232,199,122,.24);
  color: rgba(246,236,216,.9);
  font-size: 11.5px; letter-spacing: .05em;
  opacity: 0; pointer-events: none;
  transition: opacity .45s ease;
  max-width: 82%; text-align: center;
}
#toast.show { opacity: 1; }

@media (max-height: 700px) {
  #prayer-text { font-size: 15px; line-height: 1.44; }
  #prayer-name { font-size: 17px; }
  #reading { flex-basis: 46%; }
}
@media (prefers-reduced-motion: reduce) {
  #bg-rays, .mote { animation: none !important; }
  /* The camera holds still rather than travelling. */
  #bg-img, #bg-img-next { transition: opacity var(--scene-fade, 900ms) ease !important; }
  /* The flare stops turning, but the glow still answers the voice - that
     is the point of the effect, not decoration. */
  .bead.active::after { animation: none !important; }
}
</style>
</head>

<body>
<div id="app">

  <!-- Background -->
  <div id="bg-layer">
    <img id="bg-img" alt=""/>
    <img id="bg-img-next" alt=""/>
    <div id="bg-rays"></div>
    <div id="bg-veil"></div>
    <div id="vignette"></div>
  </div>

  <!-- Ambient background music. No `src` here on purpose: preload="none"
       alone still lets some browsers fetch metadata eagerly, so the file
       path is only assigned to `.src` in JS, and only from playMusic(),
       which only runs once a real user gesture happens (first tap on the
       start screen, or the Begin button as a fallback) with the music
       setting on. That is what guarantees zero bytes of audio download
       for anyone who opens the rosary and never touches it, or who has
       music switched off. -->
  <audio id="ambient-music" loop preload="none"></audio>

  <!-- Header -->
  <header>
    <h1 class="serif set-name" id="hdr-set">Holy Rosary<span class="set-sub" id="hdr-sub">Ready</span></h1>
    <div class="tools">
      <button class="tool serif" id="btn-lang" title="Language">EN</button>
      <button class="tool" id="btn-mic" title="Voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/>
        </svg>
      </button>
      <button class="tool" id="btn-exit" title="Exit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
          <path d="M16 17l5-5-5-5"/><path d="M21 12H10"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Rosary -->
  <div id="stage">
    <div id="rosary">
      <svg id="chain" viewBox="0 0 340 396">
        <polyline id="cord"/>
        <line id="cord-a"/>
        <line id="cord-b"/>
      </svg>
      <div id="cross"></div>
      <div id="medal"><span id="medal-face"></span></div>
    </div>
  </div>

  <!-- Prayer text -->
  <div id="reading">
    <div id="mystery-line"></div>
    <h2 class="serif" id="prayer-name">&nbsp;</h2>
    <div class="body-serif" id="prayer-text"></div>
    <div id="voice-track"><div id="voice-fill"></div></div>
    <div id="footline"><span id="foot-left"></span><span id="foot-right"></span></div>
    <div id="tap-hint">Tap anywhere to continue</div>
  </div>

  <div id="tapzone"></div>
  <div id="toast"></div>

  <!-- Start -->
  <div id="start">
    <div id="start-slides"></div>
    <div id="start-overlay"></div>

    <!-- Gear opens the settings panel below. Sits where the old EN/FIL

// Traditional weekday schedule: Sun..Sat
const DAY_SET = ["glorious","joyful","sorrowful","glorious","luminous","sorrowful","joyful"];

/* ==================================================================
   THE LITURGICAL DAY

   Season and week only - deliberately no saints' memorials or
   solemnities, so this can never disagree with a parish bulletin about
   who's being celebrated. Computed fresh every time from the date, with
   Easter as the one anchor (Anonymous Gregorian algorithm), so nothing
   here is a hardcoded table that can drift out of date.
   ================================================================== */
const Liturgical = (function () {
  function computeEaster(year) {
    const a = year % 19, b = Math.floor(year / 100), c = year % 100;
    const d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
  }

  function dOnly(dt) { return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
  function addDays(dt, n) { const r = dOnly(dt); r.setDate(r.getDate() + n); return r; }
  function daysBetween(a, b) { return Math.round((dOnly(a) - dOnly(b)) / 86400000); }
  function sameDate(a, b) { return daysBetween(a, b) === 0; }
  function weekSundayOf(dt) { return addDays(dt, -dt.getDay()); }

  const WEEKDAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const ORD_WORD = ["First","Second","Third","Fourth","Fifth","Sixth"];
  function ordNum(n) {
    const s = ["th","st","nd","rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function adventStartFor(y) {
    const christmas = new Date(y, 11, 25);
    const dow = christmas.getDay();
    const lastAdventSunday = addDays(christmas, -(dow === 0 ? 7 : dow));
    return addDays(lastAdventSunday, -21);
  }
  function epiphanyFor(y) {
    for (let dd = 2; dd <= 8; dd++) {
      const cand = new Date(y, 0, dd);
      if (cand.getDay() === 0) return cand;
    }
    return null;
  }
  function baptismFor(y) {
    const epi = epiphanyFor(y);
    const epiDay = epi.getDate();
    return epiDay >= 7 ? addDays(epi, 1) : addDays(epi, 7);
  }

  function formatAdvent(date, advent1) {
    const weekSun = weekSundayOf(date);
    const weekIndex = Math.min(4, Math.floor(daysBetween(weekSun, advent1) / 7) + 1);
    const word = ORD_WORD[weekIndex - 1];
    if (date.getDay() === 0) return word + " Sunday of Advent";
    return WEEKDAY[date.getDay()] + " of the " + word + " Week of Advent";
  }
  function formatChristmas(date, christmas, baptism) {
    if (sameDate(date, christmas)) return "Christmas";
    if (sameDate(date, baptism)) return "The Baptism of the Lord";
    return WEEKDAY[date.getDay()] + " of the Christmas Season";
  }
  function formatLent(date, ashWed, easter) {
    if (sameDate(date, ashWed)) return "Ash Wednesday";
    const holyThu = addDays(easter, -3);
    if (sameDate(date, holyThu)) return "Holy Thursday";
    const palmSun = addDays(easter, -7);
    if (date >= palmSun && date < holyThu) {
      if (sameDate(date, palmSun)) return "Palm Sunday";
      return WEEKDAY[date.getDay()] + " of Holy Week";
    }
    const lent1Sun = addDays(ashWed, 4);
    if (date < lent1Sun) return WEEKDAY[date.getDay()] + " after Ash Wednesday";
    const weekSun = weekSundayOf(date);
    const weekIndex = Math.floor(daysBetween(weekSun, lent1Sun) / 7) + 1;
    if (date.getDay() === 0) return ORD_WORD[weekIndex - 1] + " Sunday of Lent";
    return WEEKDAY[date.getDay()] + " of the " + ordNum(weekIndex) + " Week of Lent";
  }
  function formatEaster(date, easter, pentecost) {
    if (sameDate(date, easter)) return "Easter Sunday";
    if (sameDate(date, pentecost)) return "Pentecost";
    const weekSun = weekSundayOf(date);
    const weekIndex = Math.floor(daysBetween(weekSun, easter) / 7) + 1;
    if (date.getDay() === 0) return ORD_WORD[Math.min(weekIndex, 6) - 1] + " Sunday of Easter";
    return WEEKDAY[date.getDay()] + " of the " + ordNum(weekIndex) + " Week of Easter";
  }
  function formatOT(date, refSunday, refWeekIndexOfRef, direction) {
    // direction +1: weekIndex grows forward from refSunday (block 1, after Baptism).
    // direction -1: weekIndex counts backward from refWeekIndexOfRef at refSunday (block 2, before Advent).
    const weekSun = weekSundayOf(date);
    const delta = direction > 0
      ? Math.floor(daysBetween(weekSun, refSunday) / 7)      // refSunday is earlier (Baptism)
      : Math.floor(daysBetween(refSunday, weekSun) / 7);     // refSunday is later (last OT Sunday)
    const weekIndex = direction > 0 ? delta + 1 : refWeekIndexOfRef - delta;
    if (date.getDay() === 0) return ordNum(weekIndex) + " Sunday in Ordinary Time";
    return WEEKDAY[date.getDay()] + " of the " + ordNum(weekIndex) + " Week in Ordinary Time";
  }

  /** Season + week, in English, for any date. No memorials, no solemnities. */
  function describe(date) {
    date = dOnly(date);
    const year = date.getFullYear();
    const easterThis = computeEaster(year);
    const advent1_thisYear = adventStartFor(year);
    const christmas_thisYear = new Date(year, 11, 25);

    if (date >= advent1_thisYear && date < christmas_thisYear)
      return formatAdvent(date, advent1_thisYear);

    const christmas_prevYear = new Date(year - 1, 11, 25);
    const baptism_thisJan = baptismFor(year);
    if (date.getMonth() === 0 && date >= christmas_prevYear && date <= baptism_thisJan)
      return formatChristmas(date, christmas_prevYear, baptism_thisJan);

    const baptism_nextJan = baptismFor(year + 1);
    if (date >= christmas_thisYear && date <= baptism_nextJan)
      return formatChristmas(date, christmas_thisYear, baptism_nextJan);

    const ashWed = addDays(easterThis, -46);
    const holyThu = addDays(easterThis, -3);
    if (date >= ashWed && date <= holyThu) return formatLent(date, ashWed, easterThis);

    const goodFri = addDays(easterThis, -2), holySat = addDays(easterThis, -1);
    if (sameDate(date, goodFri)) return "Good Friday";
    if (sameDate(date, holySat)) return "Holy Saturday";

    const pentecost = addDays(easterThis, 49);
    if (date >= easterThis && date <= pentecost) return formatEaster(date, easterThis, pentecost);

    const baptism_thisYear = baptismFor(year);
    if (date > baptism_thisYear && date < ashWed)
      return formatOT(date, baptism_thisYear, 0, +1);

    if (date > pentecost && date < advent1_thisYear) {
      const lastOTSunday = addDays(advent1_thisYear, -7);
      return formatOT(date, lastOTSunday, 34, -1);
    }

    return WEEKDAY[date.getDay()] + " in Ordinary Time"; // unreachable in practice
  }

  return { computeEaster: computeEaster, describe: describe };
})();

   this file are unrelated and untouched.) */
const START_SET_NAMES = {
  en: { joyful:"The Joyful Mysteries", sorrowful:"The Sorrowful Mysteries", glorious:"The Glorious Mysteries", luminous:"The Luminous Mysteries" },
  tl: { joyful:"Maligayang Misteryo", sorrowful:"Mahapding Misteryo", glorious:"Maluwalhating Misteryo", luminous:"Misteryo ng Liwanag" }
};

/* ==================================================================
   BEAD GEOMETRY

   One coordinate space: the SVG viewBox matches the wrapper's pixel
   size, so SVG user units are CSS pixels. Every number below lives in
   that space, and every bead is placed by its centre.

   The loop is spaced by ARC LENGTH, not by parametric angle - equal
   angle steps bunch beads up at the left and right extremes of an
   ellipse. Beads occupy one more slot than there are beads, and the
   unused slot lands exactly at 6 o'clock, where the medal hangs.
   ================================================================== */
/* A round loop, per the reference image. A circle carries far more
   perimeter than a flat ellipse of the same width, so the beads sit much
   further apart without any of them getting smaller. */
const GEO = { w:336, h:515, cx:168, cy:165, rx:155, ry:155 };

const BEAD_SMALL = 9, BEAD_LARGE = 17, MEDAL_SIZE = 28, CROSS_SIZE = 32;

const JX = GEO.cx, JY = GEO.cy + GEO.ry;      // (170, 194) - the 6 o'clock point
const TAIL_STEP = 20, TAIL_TOP = JY + 40;     // 234

const rad = d => d * Math.PI / 180;

/* --- sample the ellipse once, walking clockwise from 6 o'clock --- */
const SAMPLES = 2000, cum = [0];
(function measure() {
  let px = GEO.cx + GEO.rx * Math.cos(rad(90)),
      py = GEO.cy + GEO.ry * Math.sin(rad(90));
  for (let s = 1; s <= SAMPLES; s++) {
    const t = rad(90) - 2 * Math.PI * s / SAMPLES;
    const nx = GEO.cx + GEO.rx * Math.cos(t),
          ny = GEO.cy + GEO.ry * Math.sin(t);
    cum.push(cum[s - 1] + Math.hypot(nx - px, ny - py));
    px = nx; py = ny;
  }
})();
const PERIM = cum[SAMPLES];

/** The point a given arc length clockwise from the 6 o'clock join. */
function atArc(target) {
  let lo = 0, hi = SAMPLES;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < target) lo = mid + 1; else hi = mid; }
  const t = rad(90) - 2 * Math.PI * lo / SAMPLES;
  return { x: GEO.cx + GEO.rx * Math.cos(t), y: GEO.cy + GEO.ry * Math.sin(t) };
}

/* The loop holds 54 beads: 50 small + 4 large. Four large beads serve five
   decades because each one carries the END of the decade just prayed and
   the START of the next; the first Our Father sits on the tail, and the
   fifth decade closes on the medal. Walking clockwise from the medal:
   ten small, a large, ten small, a large, ... ending on the fifth ten. */
const LOOP_COUNT = 54;
const LOOP_LARGE = [10, 21, 32, 43];
const DECADE_START = [0, 11, 22, 33, 44];   // first Hail Mary bead of each decade

function loopPos(i) { return atArc(PERIM * (i + 1) / (LOOP_COUNT + 1)); }

/* --- medal and pendant: one straight vertical line at x = JX --- */
const MEDAL_POS = { x: JX, y: JY + 18 };                       // 212
const PENDANT_POS = [                                           // 0 = nearest the cross
  { x: JX, y: TAIL_TOP + 100, size: BEAD_LARGE },   // 334  Our Father
  { x: JX, y: TAIL_TOP +  80, size: BEAD_SMALL },   // 314  Hail Mary 1
  { x: JX, y: TAIL_TOP +  60, size: BEAD_SMALL },   // 294  Hail Mary 2
  { x: JX, y: TAIL_TOP +  40, size: BEAD_SMALL },   // 274  Hail Mary 3
  { x: JX, y: TAIL_TOP +  20, size: BEAD_LARGE }    // 254  Glory Be
];
const CROSS_POS = { x: JX, y: TAIL_TOP + 130 };                 // 364

/** Place an element by its centre. */
function place(elm, x, y, size) {
  elm.style.left   = (x - size / 2) + "px";
  elm.style.top    = (y - size / 2) + "px";
  elm.style.width  = size + "px";
  elm.style.height = size + "px";
}

/* ==================================================================
   SEQUENCE - the complete Rosary
   ================================================================== */
/**
 * A walk around the rosary. Every step belongs to exactly one bead, and a
 * bead may own several consecutive steps - the crucifix owns two at the
 * start, a large loop bead owns four. The crucifix appears twice, so it
 * shines again at the very end.
 */
function buildSequence(setKey, lang) {
  const L = P[lang], s = [];
  const M = kind => ({ kind:kind, name:L.names[kind], text:L[kind], voice:true });
  const CROSS = { t:"cross" }, MEDAL = { t:"medal" };
  const pend = i => ({ t:"pend", i:i });
  const loop = i => ({ t:"loop", i:i });

  const announce = d => {
    const pair = L.mysteries[setKey][d];
    return { kind:"mystery", voice:false, decade:d + 1,
             name:pair[0], text:pair[1], announce:L.ui.announce(L.ordinals[d]) };
  };

  // 1. The crucifix - Sign of the Cross, then the Creed.
  s.push(Object.assign(M("sign"),  { bead:CROSS, section:"open" }));
  s.push(Object.assign(M("creed"), { bead:CROSS, section:"open" }));

  // 2. The large bead above the cross - Our Father.
  s.push(Object.assign(M("of"), { bead:pend(0), section:"open" }));

  // 3. Three small beads - Hail Mary each, for Faith, Hope and Charity.
  for (let i = 1; i <= 3; i++)
    s.push(Object.assign(M("hm"), { bead:pend(i), section:"open", beadNum:i, beadTotal:3 }));

  // 4. The second large tail bead - Glory Be, announce Mystery 1, its Our Father.
  s.push(Object.assign(M("glory"), { bead:pend(4), section:"open" }));
  s.push(Object.assign(announce(0), { bead:pend(4) }));
  s.push(Object.assign(M("of"),    { decade:1, bead:pend(4) }));

  // 5-7. Each decade's ten small beads, then a large bead closing that
  //      decade and opening the next.
  for (let d = 0; d < 5; d++) {
    for (let b = 1; b <= 10; b++)
      s.push(Object.assign(M("hm"), { decade:d + 1, beadNum:b, beadTotal:10,
                                      bead: loop(DECADE_START[d] + b - 1) }));
    if (d < 4) {
      const big = loop(LOOP_LARGE[d]);
      s.push(Object.assign(M("glory"),  { decade:d + 1, bead:big }));
      s.push(Object.assign(M("fatima"), { decade:d + 1, bead:big }));
      s.push(Object.assign(announce(d + 1), { bead:big }));
      s.push(Object.assign(M("of"),     { decade:d + 2, bead:big }));
    }
  }

  // 8. The medal - the fifth decade's Glory Be and Fatima, then Hail Holy Queen.
  s.push(Object.assign(M("glory"),  { decade:5, bead:MEDAL }));
  s.push(Object.assign(M("fatima"), { decade:5, bead:MEDAL }));
  s.push(Object.assign(M("salve"),  { bead:MEDAL, section:"close" }));

  // 9. The crucifix again - the closing Sign of the Cross.
  s.push(Object.assign(M("sign"), { bead:CROSS, section:"close" }));

  return s;
}

/* ==================================================================
   KARAOKE TEXT

   The prayer is broken into lines, and each line into words. Two levels
   of highlight: a soft glow on the line being prayed, and a much stronger
   one on each word as it is actually spoken.
   ================================================================== */
const Karaoke = { words: [], lines: [], tokens: [], pointer: 0, on: false };

/** Break a prayer into short, speakable lines at its natural pauses. */
function splitLines(text) {
  const parts = text.split(/(?<=[,;:.])\s+/);
  const count = s => s.trim().split(/\s+/).filter(Boolean).length;

  const merged = [];
  let cur = [];
  for (let i = 0; i < parts.length; i++) {
    cur.push(parts[i].trim());
    if (count(cur.join(" ")) >= 4) { merged.push(cur.join(" ")); cur = []; }
  }
  if (cur.length) {
    const tail = cur.join(" ");
    if (merged.length && count(tail) < 3) merged[merged.length - 1] += " " + tail;
    else merged.push(tail);
  }

  const lines = [];                       // nothing longer than a glance
  for (let i = 0; i < merged.length; i++) {
    const w = merged[i].split(/\s+/).filter(Boolean);
    if (w.length <= 9) lines.push(w.join(" "));
    else for (let j = 0; j < w.length; j += 7) lines.push(w.slice(j, j + 7).join(" "));
  }
  return lines.filter(Boolean);
}

/** Strip a displayed word down to something worth comparing against. */
function normWord(w) {
  return w.toLowerCase().normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .replace(/[^a-z0-9]/g, "");
}

/** Build the line/word DOM for a step. */
function renderPrayerText(step) {
  const host = el.prayerText;
  host.innerHTML = "";
  Karaoke.words = []; Karaoke.lines = []; Karaoke.tokens = []; Karaoke.pointer = 0;

  const body = step.kind === "mystery" ? step.announce + " — " + step.text : step.text;
  const lines = splitLines(body);
  let tokenCount = 0;

  for (let li = 0; li < lines.length; li++) {
    const lineEl = document.createElement("div");
    lineEl.className = "pline";
    const start = tokenCount;

    const parts = lines[li].split(/\s+/).filter(Boolean);
    for (let wi = 0; wi < parts.length; wi++) {
      const span = document.createElement("span");
      span.className = "pword";
      span.textContent = parts[wi];
      // This word lights once that many spoken words have been matched.
      span.dataset.at = String(tokenCount);
      lineEl.appendChild(span);
      lineEl.appendChild(document.createTextNode(" "));
      Karaoke.words.push(span);

      const n = normWord(parts[wi]);
      if (n) { Karaoke.tokens.push(n); tokenCount++; }
    }

    Karaoke.lines.push({ el: lineEl, start: start, end: tokenCount });
    host.appendChild(lineEl);
  }

  host.classList.toggle("karaoke", !!Karaoke.on);
  paintKaraoke(0, true);
}

/**
 * Ease the type down a little, but only as far as needed, so a prayer sits
 * whole on the screen. Prayer lengths differ a lot - the Tagalog Hail Mary
 * runs well past the English one - and a single fixed size cannot serve
 * both. The long ones (the Creed, the Hail Holy Queen) hit the floor and
 * scroll, which is fine: they are said once. The Hail Mary is said fifty
 * three times, and it always fits.
 */
const PRAYER_MIN_PX = 13;

const PRAYER_LEAD_OPEN  = 1.48;   // roomy, for the short prayers
const PRAYER_LEAD_TIGHT = 1.30;   // closer, once a prayer needs the space

function fitPrayerText() {
  const pt = el.prayerText;
  pt.style.fontSize = "";                       // back to the stylesheet size
  pt.style.lineHeight = "";
  const start = parseFloat(getComputedStyle(pt).fontSize) || 16;
  if (!pt.clientHeight) return;

  let size = start;
  while (size > PRAYER_MIN_PX && pt.scrollHeight > pt.clientHeight) {
    size -= 0.5;
    // Draw the lines closer together as the type gets smaller - tightening
    // the leading buys more height than shrinking the letters alone.
    const t = (start - size) / Math.max(0.5, start - PRAYER_MIN_PX);
    pt.style.fontSize = size + "px";
    pt.style.lineHeight = (PRAYER_LEAD_OPEN + (PRAYER_LEAD_TIGHT - PRAYER_LEAD_OPEN) * t).toFixed(3);
  }
}

/** Light every word up to `p`, and glow the line being prayed. */
function paintKaraoke(p, force) {
  if (!force && p === Karaoke.pointer) return;
  const prev = Karaoke.pointer;
  Karaoke.pointer = p;

  for (let i = 0; i < Karaoke.words.length; i++) {
    const w = Karaoke.words[i];
    const at = +w.dataset.at;
    const spoken = at < p;
    w.classList.toggle("spoken", spoken);
    // One short bloom on the word just said - never on a plain repaint.
    if (!force && spoken && at >= prev && at < p) {
      w.classList.remove("bloom");
      void w.offsetWidth;                       // restart the animation
      w.classList.add("bloom");
    }
  }

  let active = Karaoke.lines.length - 1;
  for (let i = 0; i < Karaoke.lines.length; i++) {
    if (p < Karaoke.lines[i].end) { active = i; break; }
  }
  for (let i = 0; i < Karaoke.lines.length; i++) {
    const L = Karaoke.lines[i];
    L.el.classList.toggle("active", i === active);
    L.el.classList.toggle("done", p >= L.end);
  }

  const cur = Karaoke.lines[active];
  if (cur && Karaoke.on) {
    const host = el.prayerText;
    const top = cur.el.offsetTop, h = cur.el.offsetHeight;
    if (top < host.scrollTop || top + h > host.scrollTop + host.clientHeight)
      host.scrollTo({ top: Math.max(0, top - host.clientHeight / 2 + h / 2), behavior: "smooth" });
  }
}

/* ==================================================================
   WORD MATCHING - medium strictness, in order, forgiving of mishears
   ================================================================== */
function words(str) {
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .split(/\s+/).filter(function (w) { return w.length > 0; });
}

function near(a, b) {
  if (a === b) return true;
  if (a.length >= 4 && b.length >= 4 && (a.indexOf(b) === 0 || b.indexOf(a) === 0)) return true;
  if (Math.abs(a.length - b.length) > 1 || a.length < 5) return false;
  var i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++;
    else if (b.length > a.length) j++;
    else { i++; j++; }
  }
  return true;
}

/**
 * Longest in-order run through the prayer, allowing small resyncs.
 * The window lets the recogniser drop or garble a few words in a row -
 * including at the very start, which it often clips - without stranding
 * the match at zero. Too wide and unrelated speech would start matching on
 * common words like "the" and "and", so 6 is about the useful limit.
 */
const RESYNC_WINDOW = 6;

/** How many of `target`'s words have been said, in order. */
function matchPointer(target, heard) {
  var p = 0;
  for (var k = 0; k < heard.length; k++) {
    for (var look = 0; look < RESYNC_WINDOW && p + look < target.length; look++) {
      if (near(target[p + look], heard[k])) { p += look + 1; break; }
    }
  }
  return p;
}

function matchProgress(target, heard) {
  return target.length ? matchPointer(target, heard) / target.length : 1;
}

/* ==================================================================
   STATE
   ================================================================== */
/* Opened straight from the hard drive, some browsers refuse localStorage
   outright. Remembering things is a nicety - it must never stop the app. */
const store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ------------------------------------------------------------------
   ROSARY SETTINGS - shared with the app shell via localStorage.

   The rosary is mounted same-origin in an <iframe> inside the SanctDemo
   app (see src/components/DailyRosary.tsx), which also has its own
   "Rosary settings" surface (src/components/RosarySettingsModal.tsx).
   Both sides read/write this one key and react to the `storage` event
   instead of using postMessage. Keep this contract - key name, field
   names, field values - identical to src/lib/rosarySettings.ts; this
   file is static HTML/JS and can't import that module directly.
   ------------------------------------------------------------------ */
const ROSARY_SETTINGS_KEY = "sanctiwalk.rosary.settings";
const DEFAULT_ROSARY_SETTINGS = { language: "en", mysterySet: "today", music: "on" };
const VALID_MYSTERY_SETS = ["today", "joyful", "sorrowful", "glorious", "luminous"];

function isValidRosarySettings(v) {
  return !!v && typeof v === "object" &&
    (v.language === "en" || v.language === "fil") &&
    VALID_MYSTERY_SETS.indexOf(v.mysterySet) !== -1 &&
    (v.music === "on" || v.music === "off");
}
function loadRosarySettings() {
  try {
    var raw = localStorage.getItem(ROSARY_SETTINGS_KEY);
    if (!raw) return { language: DEFAULT_ROSARY_SETTINGS.language, mysterySet: DEFAULT_ROSARY_SETTINGS.mysterySet, music: DEFAULT_ROSARY_SETTINGS.music };
    var parsed = JSON.parse(raw);
    return isValidRosarySettings(parsed) ? parsed : { language: DEFAULT_ROSARY_SETTINGS.language, mysterySet: DEFAULT_ROSARY_SETTINGS.mysterySet, music: DEFAULT_ROSARY_SETTINGS.music };
  } catch (e) {
    return { language: DEFAULT_ROSARY_SETTINGS.language, mysterySet: DEFAULT_ROSARY_SETTINGS.mysterySet, music: DEFAULT_ROSARY_SETTINGS.music };
  }
}
function saveRosarySettings(settings) {
  try { localStorage.setItem(ROSARY_SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}
function parseRosarySettingsEventValue(newValue) {
  if (!newValue) return { language: DEFAULT_ROSARY_SETTINGS.language, mysterySet: DEFAULT_ROSARY_SETTINGS.mysterySet, music: DEFAULT_ROSARY_SETTINGS.music };
  try {
    var parsed = JSON.parse(newValue);
    return isValidRosarySettings(parsed) ? parsed : { language: DEFAULT_ROSARY_SETTINGS.language, mysterySet: DEFAULT_ROSARY_SETTINGS.mysterySet, music: DEFAULT_ROSARY_SETTINGS.music };
  } catch (e) {
    return { language: DEFAULT_ROSARY_SETTINGS.language, mysterySet: DEFAULT_ROSARY_SETTINGS.mysterySet, music: DEFAULT_ROSARY_SETTINGS.music };
  }
}
// The prayer engine's internal language tag ("en"/"tl") predates the
// shared settings contract ("en"/"fil") - map between them at the edges
// rather than touch every S.lang reference in the engine below.
function prefToLang(pref) { return pref === "fil" ? "tl" : "en"; }
function langToPref(lang) { return lang === "tl" ? "fil" : "en"; }

const INITIAL_ROSARY_SETTINGS = loadRosarySettings();

const S = {
  lang: prefToLang(INITIAL_ROSARY_SETTINGS.language),
  mysterySet: INITIAL_ROSARY_SETTINGS.mysterySet,
  musicOn: INITIAL_ROSARY_SETTINGS.music !== "off",
  set: INITIAL_ROSARY_SETTINGS.mysterySet === "today"
    ? DAY_SET[new Date().getDay()]
    : INITIAL_ROSARY_SETTINGS.mysterySet,
  seq: [], idx: 0,

  voiceWanted: true, voiceLive: false,

  wakeLock: null
};

const $ = function (id) { return document.getElementById(id); };
const el = {
  app:$("app"), bgA:$("bg-img"), bgB:$("bg-img-next"), bgLayer:$("bg-layer"),
  hdrSet:$("hdr-set"), hdrSub:$("hdr-sub"),
  btnLang:$("btn-lang"), btnMic:$("btn-mic"),
  stage:$("stage"), rosary:$("rosary"), cross:$("cross"), medal:$("medal"),
  mysteryLine:$("mystery-line"), prayerName:$("prayer-name"), prayerText:$("prayer-text"),
